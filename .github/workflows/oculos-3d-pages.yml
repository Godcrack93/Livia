name: Publicar Óculos Mágico no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "oculos-3d/**"
      - ".github/workflows/oculos-3d-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oculos-3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: oculos-3d/package-lock.json
      - run: npm ci
      - run: npm run niveis
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: oculos-3d/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
