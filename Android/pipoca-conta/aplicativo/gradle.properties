# Memória do Gradle e codificação dos arquivos-fonte.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# As bibliotecas do Google (activity, core, webkit, Billing) são AndroidX.
android.useAndroidX=true
# Cada módulo enxerga só os próprios recursos na classe R.
android.nonTransitiveRClass=true
kotlin.code.style=official
