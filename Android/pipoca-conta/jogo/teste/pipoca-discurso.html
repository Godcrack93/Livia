<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<base href="../">
<title>Pipoca: expressões no discurso do vovô Tufo</title>
<link rel="stylesheet" href="estilo.css">
<style>
  html, body { overflow: auto !important; height: auto !important; position: static !important; }
  body { margin: 0; background: #FFF6E9; font-family: Fredoka, sans-serif; color: #3A2A5A; padding: 24px; }
  h1 { font-size: 30px; margin: 0 0 6px; }
  .sub { font-size: 18px; margin: 0 0 18px; max-width: 1100px; }
  .grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; max-width: 1400px; }
  .card { background: #fff; border: 4px solid #3A2A5A; border-radius: 24px; padding: 16px 18px; }
  .card h2 { font-size: 24px; margin: 0 0 4px; }
  .card .ideia { font-size: 16px; margin: 0 0 10px; min-height: 42px; }
  .cena { display: flex; align-items: flex-end; gap: 10px; height: 330px; background: #FDF1DC; border-radius: 16px; padding: 0 12px; }
  .pip { width: 290px; height: 314px; flex: none; }
  .quadro { width: 120px; height: 160px; border: 8px solid #C98A55; border-radius: 10px; outline: 4px solid #3A2A5A; margin: 0 0 120px 8px;
    background: url(img/sagui-foto.jpg) center / cover; flex: none; }
  .frases { font-size: 17px; line-height: 1.45; margin: 12px 0; }
  .frases span { padding: 1px 3px; border-radius: 6px; transition: background .2s; }
  .frases span.agora { background: #FFD23F; }
  .frases span small { color: #9B7BFF; font-size: 13px; }
  button { font: 600 20px Fredoka, sans-serif; padding: 10px 18px; border: 4px solid #3A2A5A; border-radius: 16px; background: #FFD23F;
    color: #3A2A5A; cursor: pointer; }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
<h1>Expressões da Pipoca no discurso do vovô Tufo</h1>
<p class="sub">Toque em "Ouvir" em cada uma. A frase que ela está falando fica amarela, e o nome roxo diz a expressão daquela frase.
  A foto fica à direita, como na casa.</p>
<div class="grade" id="grade"></div>
<script src="js/nucleo.js"></script>
<script src="js/som.js"></script>
<script src="vozes/indice.js"></script>
<script src="vozes/bocas.js"></script>
<script src="vozes/longas.js"></script>
<script src="js/voz.js"></script>
<script src="js/dados.js"></script>
<script src="js/arte.js"></script>
<script src="js/pipoca.js"></script>
<script>
  const FRASES = ['Olha só!', 'Esse é o meu vovô Tufo!', 'Ele é um sagui-de-tufos-brancos, igualzinho a mim.',
    'Sabia que a gente é um macaquinho bem pequenininho do Brasil?', 'Cabe na palma da mão!',
    'Olha os tufinhos brancos nas orelhas, e o rabo listrado!', 'A gente mora nas árvores e adora comer frutinhas.',
    'Quem tirou essa foto foi Evija Martina.'];
  // rostos (só números do rosto, por cima da pose)
  const R = {
    encantada: { nome: 'encantada', r: { olhoEsc: 1.14, sobOp: 1, sobEy: -4, sobDy: -4, corar: .95, bSorriso: 1 } },
    orgulhosa: { nome: 'orgulhosa', r: { feliz: .85, corar: 1.1, cabRot: 6, sobOp: .6, sobEy: -2, sobDy: -2 } },
    risonha: { nome: 'risonha', r: { feliz: 1, corar: 1.05, bSorriso: 1.2, cabRot: -4 } },
    curiosa: { nome: 'curiosa', r: { olhoEsc: 1.08, sobOp: 1, sobEy: -7, sobDy: -1, sobEr: -6, cabRot: -9 } },
    espantada: { nome: 'espantada', r: { olhoEsc: 1.22, sobOp: 1, sobEy: -6, sobDy: -6, corar: .8 } },
    sonhadora: { nome: 'sonhadora', r: { palE: .45, palD: .45, cabRot: 6, corar: 1, olharY: -2 } },
    gentil: { nome: 'gentil', r: { feliz: .55, cabRot: -5, corar: .85 } },
    piscadinha: { nome: 'piscadinha', r: { corar: 1.05 } },
  };
  const FOTO = [1, -.3], CRIANCA = [-.1, 0];
  // cada proposta: uma entrada por frase { pose?, rosto?, olha? }
  const PROPOSTAS = [
    { titulo: 'Atual', ideia: 'Como está hoje na casa: pose "feliz" o tempo todo, olhando para a foto.',
      passos: FRASES.map(() => ({ pose: 'feliz', olha: FOTO })) },
    { titulo: 'Proposta 1: só o rosto conta', ideia: 'O corpo fica calmo; o rosto muda a cada frase: encantada, orgulhosa, curiosa na pergunta, espantada com o "cabe na palma da mão", sonhadora com as frutinhas.',
      passos: [
        { pose: 'feliz', rosto: R.encantada, olha: FOTO }, { pose: 'feliz', rosto: R.orgulhosa, olha: FOTO },
        { pose: 'feliz', rosto: R.risonha, olha: CRIANCA }, { pose: 'feliz', rosto: R.curiosa, olha: CRIANCA },
        { pose: 'feliz', rosto: R.espantada, olha: CRIANCA }, { pose: 'feliz', rosto: R.encantada, olha: FOTO },
        { pose: 'feliz', rosto: R.sonhadora, olha: CRIANCA }, { pose: 'feliz', rosto: R.gentil, olha: CRIANCA }] },
    { titulo: 'Proposta 2: rosto e corpo juntos', ideia: 'Ela gesticula como quem conta uma história: aponta para a foto, faz carinho, pensa na pergunta, se espanta, aponta os tufinhos e termina com joinha.',
      passos: [
        { pose: 'surpresa', rosto: R.encantada, olha: FOTO }, { pose: 'aponta', rosto: R.orgulhosa, olha: FOTO },
        { pose: 'carinho', rosto: R.risonha, olha: CRIANCA }, { pose: 'pensa', rosto: R.curiosa, olha: CRIANCA },
        { pose: 'surpresa', rosto: R.espantada, olha: CRIANCA }, { pose: 'aponta', rosto: R.encantada, olha: FOTO },
        { pose: 'normal', rosto: R.sonhadora, olha: CRIANCA }, { pose: 'joia', rosto: R.piscadinha, olha: CRIANCA }] },
    { titulo: 'Proposta 3: carinho pelo vovô', ideia: 'Mais suave e afetiva: olha muito para a foto, com bochechas bem coradas; só se vira para a criança na pergunta e no fim.',
      passos: [
        { pose: 'feliz', rosto: R.encantada, olha: FOTO }, { pose: 'carinho', rosto: R.orgulhosa, olha: FOTO },
        { pose: 'carinho', rosto: R.risonha, olha: FOTO }, { pose: 'ouve', rosto: R.curiosa, olha: CRIANCA },
        { pose: 'feliz', rosto: R.espantada, olha: CRIANCA }, { pose: 'carinho', rosto: R.encantada, olha: FOTO },
        { pose: 'carinho', rosto: R.sonhadora, olha: FOTO }, { pose: 'feliz', rosto: R.gentil, olha: CRIANCA }] },
  ];

  // quando começa cada frase no áudio gravado: estimado pelo tamanho das frases e encaixado na pausa mais perto
  const INICIOS = (() => {
    const s = (window.PC_BOCAS || {})['9001-historia-vovo-tufo.mp3'] || '';
    const cues = [...s.matchAll(/([A-HX])(\d+)/g)].map(m => [m[1], +m[2] / 100]);
    const total = cues.length ? cues[cues.length - 1][1] : 22;
    const pausas = cues.filter(c => c[0] === 'X').map(c => c[1]);
    const tam = FRASES.map(f => f.length), soma = tam.reduce((a, b) => a + b, 0);
    let acc = 0;
    return FRASES.map((f, k) => {
      const est = total * acc / soma; acc += tam[k];
      if (!k) return 0;
      const perto = pausas.reduce((m, p) => (Math.abs(p - est) < Math.abs(m - est) ? p : m), Infinity);
      return Math.abs(perto - est) < 1 ? perto : est;
    });
  })();
  let tocando = 0;
  const grade = document.getElementById('grade');
  PROPOSTAS.forEach(pr => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2>${pr.titulo}</h2><p class="ideia">${pr.ideia}</p><div class="cena"><div class="pip"></div><div class="quadro"></div></div>` +
      `<div class="frases">${FRASES.map((f, k) => `<span>${f}${pr.passos[k].rosto ? ` <small>(${pr.passos[k].rosto.nome}${pr.passos[k].pose !== 'feliz' ? ', ' + pr.passos[k].pose : ''})</small>` : ''}</span>`).join(' ')}</div><button>Ouvir</button>`;
    grade.appendChild(card);
    const rig = PC.pipoca.criar(card.querySelector('.pip'), { pose: 'feliz' });
    const spans = [...card.querySelectorAll('.frases span')];
    const aplicar = k => {
      const p = pr.passos[k];
      spans.forEach((s, j) => s.classList.toggle('agora', j === k));
      rig.pose(p.pose || 'feliz');
      rig.rosto(p.rosto ? p.rosto.r : null);
      if (p.olha) rig.olhar(p.olha[0], p.olha[1], 8000);
    };
    card.querySelector('button').onclick = () => {
      const meu = ++tocando;
      PC.voz.parar && PC.voz.parar();
      let atual = -1;
      aplicar(0); atual = 0;
      rig.falar(true);
      let acabou = false;
      const fim = PC.voz.falar(FRASES.join(' ')).then(() => { acabou = true; if (meu === tocando) { rig.falar(false); spans.forEach(s => s.classList.remove('agora')); rig.rosto(null); rig.pose('feliz'); } });
      // a expressão troca no começo de cada frase (tempos tirados das pausas do próprio áudio)
      (function seguir() {
        if (meu !== tocando) return;
        const t = PC.voz.tempoAgora();
        if (t >= 0) { let k = 0; while (k + 1 < INICIOS.length && INICIOS[k + 1] <= t + .15) k++; if (k !== atual) { atual = k; aplicar(k); } }
        if (!acabou) requestAnimationFrame(seguir);
      })();
      void fim;
    };
  });
</script>
</body>
</html>
