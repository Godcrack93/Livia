<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Figurinhas</title>
<link rel="stylesheet" href="../estilo.css">
<style>
  html, body { overflow: auto !important; height: auto !important; position: static !important; }
  body { margin: 0; padding: 24px; background: #DFF3D2; font-family: Fredoka, sans-serif; color: #3A2A5A; }
  .grade { display: flex; flex-wrap: wrap; gap: 18px; }
  .item { text-align: center; font-size: 16px; }
  .item div { width: var(--t, 260px); height: var(--t, 260px); }
  .item svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="grade" id="grade"></div>
<script src="../js/nucleo.js"></script>
<script src="../js/arte.js"></script>
<script src="../js/pipoca.js"></script>
<script src="../js/figurinhas.js"></script>
<script>
  const so = (location.search.match(/so=([\d,]+)/) || [])[1];
  for (const f of PC.figurinhas.lista) {
    const n = Number(f.id.slice(3));
    if (so && !so.split(',').includes(String(n))) continue;
    const d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = `<div>${PC.figurinhas.desenho(f.id)}</div>${n}. ${f.nome}`;
    document.getElementById('grade').appendChild(d);
  }
</script>
</body>
</html>
