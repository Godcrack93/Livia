<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pipoca: poses</title>
<link rel="stylesheet" href="../estilo.css">
<style>
  html, body { overflow: auto !important; height: auto !important; position: static !important; }
  body { margin: 0; padding: 20px; background: #DFF3D2; font-family: Fredoka, sans-serif; color: #3A2A5A; }
  .grade { display: flex; flex-wrap: wrap; gap: 14px; }
  .item { background: #ffffffaa; border-radius: 20px; padding: 10px; text-align: center; font-size: 18px; }
  .item div { width: 250px; height: 270px; }
  .item svg { width: 100%; height: 100%; overflow: visible; }
  body.parado * { animation: none !important; }
</style>
</head>
<body>
<div class="grade" id="grade"></div>
<script src="../js/nucleo.js"></script>
<script src="../js/arte.js"></script>
<script src="../js/pipoca.js"></script>
<script>
  if (location.search.includes('parado')) document.body.classList.add('parado');
  for (const pose of PC.arte.poses()) {
    const d = document.createElement('div');
    d.className = 'item' + (pose === 'fala' && location.search.includes('falando') ? ' falando' : '');
    d.innerHTML = `<div>${PC.arte.pipoca(pose)}</div>${pose}`;
    document.getElementById('grade').appendChild(d);
  }
</script>
</body>
</html>
