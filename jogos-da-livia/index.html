<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jogos da Lívia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lilita+One&display=swap">
<style>
/* Layout: um parque ao ar livre — céu pastel com nuvens, colinas embaixo e os jogos em cartões grandes no centro. */
:root {
  color-scheme: light;
  --ink: #2A1B4D;
  --ink-soft: #6B5C93;
  --paper: #FFFFFF;
  --sky-top: #FFD6EA;
  --sky-mid: #E2D6FF;
  --sky-low: #C2EBFF;
  --gold: #FFC93C;
  --lilac: #B9A8F0;
  --f-display: 'Lilita One', 'Baloo 2', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
  --f-ui: 'Baloo 2', 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; overflow-x: hidden; color: var(--ink); font-family: var(--f-ui);
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 50%, var(--sky-low) 100%) fixed;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
}
a { color: inherit; }
:focus-visible { outline: 3px solid #FF6A3D; outline-offset: 4px; }

/* ---------- cenário ---------- */
.scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.sun { position: absolute; right: 8%; top: 7%; width: clamp(90px, 14vw, 170px); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, #FFF3B8 0 45%, rgba(255, 243, 184, .5) 60%, rgba(255, 243, 184, 0) 72%); animation: glow 4s ease-in-out infinite alternate; }
@keyframes glow { to { transform: scale(1.08); } }
.cloud { position: absolute; width: 170px; height: 74px; opacity: .9; animation: drift linear infinite; }
.cloud svg { width: 100%; height: 100%; display: block; }
.cloud.c1 { top: 10%; animation-duration: 80s; animation-delay: -20s; }
.cloud.c2 { top: 30%; width: 120px; height: 52px; opacity: .7; animation-duration: 110s; animation-delay: -70s; }
.cloud.c3 { top: 4%; width: 130px; height: 56px; opacity: .6; animation-duration: 140s; animation-delay: -100s; }
@keyframes drift { from { transform: translateX(-220px); } to { transform: translateX(calc(100vw + 40px)); } }
.spark { position: absolute; width: 14px; height: 14px; color: #fff; animation: twinkle 2.6s ease-in-out infinite; }
.spark svg { width: 100%; height: 100%; display: block; }
@keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.6) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
.hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: clamp(110px, 22vh, 220px); display: block; }

/* ---------- conteúdo ---------- */
.wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: clamp(22px, 6vh, 64px) 16px clamp(120px, 24vh, 220px);
  transition: opacity .3s ease, transform .3s ease; }
body.leaving .wrap { opacity: 0; transform: scale(.97); }
.hero { text-align: center; margin-bottom: clamp(20px, 4vh, 40px); }
.logo { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(46px, 9.5vw, 104px); line-height: 1.02; letter-spacing: .01em; text-wrap: balance; }
.logo .word { display: inline-block; white-space: nowrap; }
.logo .l { display: inline-block; color: var(--c);
  text-shadow: 0 4px 0 var(--ink), 3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink), 0 12px 20px rgba(42, 27, 77, .25);
  animation: hop 2.2s ease-in-out infinite; animation-delay: calc(var(--i) * 80ms); }
@keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-9px); } }
.lede { margin: 12px 0 0; font: 700 clamp(19px, 2.4vw, 24px)/1.3 var(--f-ui); color: var(--ink-soft); }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 370px)); justify-content: center; gap: clamp(18px, 3vw, 30px); }
.card { position: relative; display: flex; flex-direction: column; min-width: 0; border-radius: 30px; overflow: hidden; text-decoration: none; background: var(--paper);
  box-shadow: 0 6px 0 rgba(42, 27, 77, .12), 0 20px 40px rgba(42, 27, 77, .18); transition: transform .22s cubic-bezier(.3, 1.6, .5, 1), box-shadow .22s;
  animation: cardIn .65s cubic-bezier(.3, 1.5, .5, 1) backwards; animation-delay: calc(var(--i) * 120ms + 150ms); }
@keyframes cardIn { from { transform: translateY(40px) scale(.9); opacity: 0; } }
a.card:hover { transform: translateY(-6px) rotate(-.6deg); box-shadow: 0 10px 0 rgba(42, 27, 77, .12), 0 28px 50px rgba(42, 27, 77, .22); }
a.card:active { transform: scale(.97); }
a.card.picked { animation: pick .32s ease forwards; }
@keyframes pick { 40% { transform: scale(1.05); } 100% { transform: scale(1.02); } }
.cover { position: relative; aspect-ratio: 16 / 10; background: color-mix(in srgb, var(--cor) 18%, white); overflow: hidden; }
.cover img, .cover svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; }
.tag { position: absolute; left: 14px; top: 14px; padding: 6px 12px 4px; border-radius: 999px; background: rgba(255, 255, 255, .94); color: var(--cor);
  font: 800 13px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 2px 0 rgba(42, 27, 77, .1); }
.body { display: grid; gap: 8px; padding: 16px 22px 22px; }
.body h2 { margin: 0; font: 400 clamp(28px, 3.2vw, 34px)/1.05 var(--f-display); color: var(--ink); }
.body p { margin: 0; font: 600 16px/1.4 var(--f-ui); color: var(--ink-soft); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.play { display: inline-flex; align-items: center; gap: 8px; padding: 10px 24px 8px 18px; border-radius: 999px; background: var(--cor); color: var(--paper);
  font: 400 23px/1 var(--f-display); box-shadow: 0 5px 0 var(--sombra, rgba(42, 27, 77, .35)); }
.play svg { width: 22px; height: 22px; }
.prog { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px 4px; border-radius: 999px; background: #FFF4D0; color: #8A5A00; font: 800 14px/1 var(--f-ui); font-variant-numeric: tabular-nums; }
.prog svg { width: 16px; height: 16px; }

.card.soon { background: rgba(255, 255, 255, .5); border: 3px dashed var(--lilac); box-shadow: none; }
.card.soon .cover { background: linear-gradient(160deg, #F3EEFF, #E3D9FF); }
.card.soon .body h2 { color: #7A64C9; }
.gift { animation: giftBob 1.8s ease-in-out infinite; transform-origin: 320px 330px; }
@keyframes giftBob { 0%, 100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-10px) rotate(-3deg); } 75% { transform: translateY(-4px) rotate(3deg); } }
.qmark { animation: hop 2.2s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) {
  .cloud, .spark, .sun, .logo .l, .card, .gift, .qmark { animation: none !important; }
}
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud c1"><svg viewBox="0 0 160 70"><path d="M30 62a22 22 0 0 1-2-44 30 30 0 0 1 56-8 24 24 0 0 1 40 14 20 20 0 0 1 6 38z" fill="#fff"/></svg></div>
  <div class="cloud c2"><svg viewBox="0 0 160 70"><path d="M30 62a22 22 0 0 1-2-44 30 30 0 0 1 56-8 24 24 0 0 1 40 14 20 20 0 0 1 6 38z" fill="#fff"/></svg></div>
  <div class="cloud c3"><svg viewBox="0 0 160 70"><path d="M30 62a22 22 0 0 1-2-44 30 30 0 0 1 56-8 24 24 0 0 1 40 14 20 20 0 0 1 6 38z" fill="#fff"/></svg></div>
  <div id="sparks"></div>
  <svg class="hills" viewBox="0 0 1200 220" preserveAspectRatio="none">
    <path d="M0 120 C 180 40, 360 60, 520 110 C 700 165, 860 70, 1020 80 C 1110 86, 1160 110, 1200 100 L 1200 220 L 0 220 Z" fill="#CDBEFF"/>
    <path d="M0 160 C 200 110, 380 130, 560 165 C 740 200, 900 120, 1200 150 L 1200 220 L 0 220 Z" fill="#B3E3C8"/>
    <path d="M0 190 C 240 160, 520 200, 760 185 C 960 172, 1100 190, 1200 182 L 1200 220 L 0 220 Z" fill="#92D4AE"/>
  </svg>
</div>

<main class="wrap">
  <header class="hero">
    <h1 class="logo" id="logo" aria-label="Jogos da Lívia"></h1>
    <p class="lede">Escolha um jogo para brincar!</p>
  </header>
  <section class="grid" id="grid" aria-label="Jogos"></section>
</main>

<script src="jogos.js"></script>
<script>
(function () {
  'use strict';
  // título com cada letra de uma cor
  const cores = ['#FF8A1F', '#EE3B3B', '#FFD83F', '#9BDB2E', '#1CC6CF', '#3B7BFF', '#7446D9', '#D946C4', '#FF7CB8', '#FFB21F', '#43BC55'];
  let k = 0;
  document.getElementById('logo').innerHTML = 'Jogos da Lívia'.split(' ').map(w =>
    `<span class="word">${[...w].map(ch => `<span class="l" style="--c:${cores[k % cores.length]};--i:${k++}">${ch}</span>`).join('')}</span>`).join(' ');

  // brilhinhos no céu
  const sp = document.getElementById('sparks');
  [[12, 22], [26, 12], [44, 30], [70, 18], [86, 34], [58, 8], [8, 48], [92, 52]].forEach(([x, y], i) => {
    const s = document.createElement('div'); s.className = 'spark';
    s.style.cssText = `left:${x}%;top:${y}%;animation-delay:${(i * 0.37).toFixed(2)}s`;
    s.innerHTML = '<svg viewBox="0 0 20 20"><path d="M10 0 L12.5 7.5 L20 10 L12.5 12.5 L10 20 L7.5 12.5 L0 10 L7.5 7.5 Z" fill="currentColor"/></svg>';
    sp.appendChild(s);
  });

  const progresso = p => {
    try { const v = JSON.parse(localStorage.getItem(p.chave) || '[]'); return Array.isArray(v) ? v.length : 0; } catch (e) { return null; }
  };
  const grid = document.getElementById('grid');
  (window.JOGOS || []).forEach((j, i) => {
    const a = document.createElement('a');
    a.className = 'card'; a.href = j.endereco;
    a.style.setProperty('--cor', j.cor); a.style.setProperty('--sombra', j.sombra || 'rgba(42,27,77,.35)'); a.style.setProperty('--i', i);
    const n = j.progresso ? progresso(j.progresso) : null;
    a.innerHTML = `<div class="cover"><img src="${j.capa}" alt=""><span class="tag">${j.tipo}</span></div>
      <div class="body"><h2>${j.nome}</h2><p>${j.frase}</p>
      <div class="row"><span class="play"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Jogar</span>
      ${n !== null ? `<span class="prog"><svg viewBox="0 0 24 24"><path d="M12 2.8l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.6l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z" fill="#FFC93C" stroke="#8A5A00" stroke-width="2" stroke-linejoin="round"/></svg>${n}/${j.progresso.total} ${j.progresso.rotulo}</span>` : ''}</div></div>`;
    a.addEventListener('click', e => {
      if (e.ctrlKey || e.metaKey || e.shiftKey) return;
      e.preventDefault(); a.classList.add('picked'); document.body.classList.add('leaving');
      setTimeout(() => { location.href = j.endereco; }, 320);
    });
    grid.appendChild(a);
  });

  // cartão de "em breve"
  const soon = document.createElement('div');
  soon.className = 'card soon'; soon.style.setProperty('--i', (window.JOGOS || []).length);
  soon.innerHTML = `<div class="cover"><svg viewBox="0 0 640 400" aria-hidden="true">
      <g class="gift"><rect x="240" y="200" width="160" height="130" rx="14" fill="#B39CFF" stroke="#4B3A8F" stroke-width="6"/>
      <rect x="226" y="168" width="188" height="44" rx="12" fill="#C9B8FF" stroke="#4B3A8F" stroke-width="6"/>
      <rect x="306" y="168" width="28" height="162" fill="#FFC93C" stroke="#4B3A8F" stroke-width="6"/>
      <path d="M320 168 C 290 120, 250 140, 272 166 Z M320 168 C 350 120, 390 140, 368 166 Z" fill="#FFC93C" stroke="#4B3A8F" stroke-width="6" stroke-linejoin="round"/></g>
      <text class="qmark" x="320" y="128" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="96" fill="#7A64C9" stroke="#4B3A8F" stroke-width="4">?</text>
      <path d="M150 120 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8z M480 90 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6z" fill="#fff"/></svg></div>
    <div class="body"><h2>Em breve</h2><p>Um jogo novo está chegando!</p></div>`;
  grid.appendChild(soon);

  // ao voltar de um jogo pelo botão "voltar" do navegador, a página aparece de novo normalmente
  window.addEventListener('pageshow', () => {
    document.body.classList.remove('leaving');
    document.querySelectorAll('.picked').forEach(x => x.classList.remove('picked'));
  });
})();
</script>
</body>
</html>
