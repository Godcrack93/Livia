<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprunkinhos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Creepster&family=Lilita+One&display=swap">
<style>
/* Layout: um palco de show infantil — céu em degradê, piso lilás com holofotes, bandeja de figurinhas embaixo. Visual único (não muda com tema claro/escuro). */
:root {
  color-scheme: light;
  --ink: #2A1B4D;
  --ink-soft: #6B5C93;
  --paper: #FFFFFF;
  --sky-top: #FFD6EA;
  --sky-mid: #E2D6FF;
  --sky-low: #C2EBFF;
  --floor-hi: #F7F2FF;
  --floor-lo: #D5C7FF;
  --night-top: #0F0B2E;
  --night-mid: #251A5E;
  --night-low: #432C86;
  --gold: #FFC93C;
  --hot: #FF6A3D;
  --f-display: 'Lilita One', 'Baloo 2', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
  --f-ui: 'Baloo 2', 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
  --tile: clamp(50px, min((100vw - 130px) / 11, 8.2vh), 72px);
  --kick: 0; --beat: 0;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden; background: var(--sky-mid); color: var(--ink);
  font-family: var(--f-ui); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
button:focus-visible, .tile:focus-visible { outline: 3px solid var(--hot); outline-offset: 3px; }
#app {
  position: relative; height: 100%; display: flex; flex-direction: column; overflow: hidden; touch-action: none;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}

/* ---------- céu ---------- */
.sky { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.sky.day { background:
  radial-gradient(60% 50% at 82% 8%, rgba(255, 244, 200, .85), rgba(255, 244, 200, 0) 70%),
  linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-low) 100%); }
.sky.night { opacity: 0; transition: opacity 1.4s ease;
  background: radial-gradient(50% 40% at 80% 10%, rgba(140, 120, 255, .35), rgba(140, 120, 255, 0) 70%),
  linear-gradient(180deg, var(--night-top) 0%, var(--night-mid) 55%, var(--night-low) 100%); }
.cloud { position: absolute; width: 160px; height: 70px; opacity: .9; animation: drift linear infinite; }
.cloud svg { width: 100%; height: 100%; display: block; }
.cloud.c1 { top: 12%; animation-duration: 70s; animation-delay: -10s; }
.cloud.c2 { top: 26%; width: 110px; height: 48px; animation-duration: 95s; animation-delay: -55s; opacity: .7; }
.cloud.c3 { top: 6%; width: 120px; height: 52px; animation-duration: 120s; animation-delay: -90s; opacity: .6; }
@keyframes drift { from { transform: translateX(-200px); } to { transform: translateX(calc(100vw + 40px)); } }
.stars { position: absolute; inset: 0 0 30% 0; opacity: 0; transition: opacity 1.6s ease; pointer-events: none;
  background-image:
    radial-gradient(2px 2px at 8% 18%, #fff, transparent), radial-gradient(2px 2px at 22% 8%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 35% 28%, #fff, transparent), radial-gradient(2px 2px at 48% 12%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 61% 30%, #fff, transparent), radial-gradient(2.5px 2.5px at 70% 6%, #FFF6C8, transparent),
    radial-gradient(1.5px 1.5px at 88% 34%, #fff, transparent), radial-gradient(2px 2px at 94% 14%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 15% 40%, #fff, transparent), radial-gradient(2px 2px at 42% 44%, #fff, transparent); }
.stars.s2 { background-image:
    radial-gradient(1.5px 1.5px at 5% 30%, #fff, transparent), radial-gradient(2px 2px at 28% 20%, #FFF6C8, transparent),
    radial-gradient(1.5px 1.5px at 55% 22%, #fff, transparent), radial-gradient(2px 2px at 77% 26%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 84% 46%, #fff, transparent), radial-gradient(2px 2px at 32% 52%, #fff, transparent); }
.moon { position: absolute; right: 7%; top: 9%; width: clamp(56px, 8vw, 96px); transform: translateY(60px) scale(.8); opacity: 0;
  transition: transform 1.6s cubic-bezier(.3, 1.3, .5, 1), opacity 1.2s; filter: drop-shadow(0 0 22px rgba(255, 230, 140, .65)); }
.is-night .sky.night, .is-night .stars { opacity: 1; }
.is-night .stars { animation: twinkle 3.2s ease-in-out infinite alternate; }
.is-night .stars.s2 { animation-duration: 2.3s; animation-delay: -1s; }
.is-night .moon { opacity: 1; transform: none; }
.is-night .cloud { opacity: .12; }
@keyframes twinkle { from { opacity: .45; } to { opacity: 1; } }
.fx-lab .sky.day { animation: huey 6s linear infinite; }
@keyframes huey { to { filter: hue-rotate(360deg); } }

/* ---------- topo ---------- */
.top { position: relative; z-index: 4; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px 4px; }
.logo { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 3.4vw, 42px); line-height: 1; letter-spacing: .01em; white-space: nowrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
a.tool { text-decoration: none; }
.intro-home { position: fixed; left: calc(16px + env(safe-area-inset-left, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); z-index: 101; width: 52px; height: 52px; border-radius: 50%;
  display: grid; place-items: center; background: var(--paper); color: var(--ink); box-shadow: 0 3px 0 rgba(42, 27, 77, .16), 0 6px 16px rgba(42, 27, 77, .12); }
.intro-home svg { width: 26px; height: 26px; }
#intro.leaving + .intro-home, #intro[hidden] + .intro-home { display: none; }
.logo span { display: inline-block; color: var(--lc);
  text-shadow: 0 3px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 8px 14px rgba(42, 27, 77, .25); }
.tools { display: flex; align-items: center; gap: 8px; }
.tool, .chip { height: 44px; border: 0; border-radius: 999px; background: var(--paper); color: var(--ink); cursor: pointer;
  box-shadow: 0 3px 0 rgba(42, 27, 77, .16), 0 6px 16px rgba(42, 27, 77, .12); display: inline-flex; align-items: center; justify-content: center;
  transition: transform .15s ease; touch-action: manipulation; }
.tool { width: 44px; padding: 0; }
.tool svg { width: 22px; height: 22px; }
.tool:active, .chip:active { transform: scale(.92); }
.chip { gap: 6px; padding: 0 14px 0 10px; font-weight: 800; font-size: 16px; background: var(--gold); font-variant-numeric: tabular-nums; }
.chip svg { width: 22px; height: 22px; }
.chip.bump { animation: bump .7s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35) rotate(-6deg); } 100% { transform: scale(1); } }

/* ---------- palco ---------- */
#stage { position: relative; z-index: 2; flex: 1; min-height: 0; --floor: 70%; }
.floor { position: absolute; left: -15%; right: -15%; top: var(--floor); bottom: -20px; border-radius: 50% 50% 0 0 / 60px 60px 0 0;
  background: linear-gradient(180deg, var(--floor-hi), var(--floor-lo)); box-shadow: 0 -2px 0 rgba(255, 255, 255, .8), inset 0 14px 30px rgba(255, 255, 255, .6); }
.floor::before { content: ''; position: absolute; left: 15%; right: 15%; top: 18px; height: 10px; border-radius: 50%; background: rgba(42, 27, 77, .06); }
.floor::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, rgba(25, 14, 70, .55), rgba(25, 14, 70, .75)); opacity: 0; transition: opacity 1.4s; }
.is-night .floor::after { opacity: 1; }
.fx-orch .floor { box-shadow: 0 -2px 0 rgba(255, 255, 255, .8), inset 0 20px 60px rgba(255, 201, 60, .75); }
.rainbow { position: absolute; left: 50%; top: var(--floor); width: min(130vw, 1500px); aspect-ratio: 1; border-radius: 50%; pointer-events: none;
  transform: translate(-50%, -50%) scale(.85); opacity: 0; transition: opacity 1.4s ease, transform 1.4s ease;
  background: radial-gradient(circle closest-side, transparent 66%, #FF6B6B 66% 69%, #FFA94D 69% 72%, #FFE066 72% 75%, #69DB7C 75% 78%, #4DABF7 78% 81%, #9775FA 81% 84%, transparent 84%); }
.fx-rainbow .rainbow { opacity: .7; transform: translate(-50%, -50%) scale(1); }
.is-night.fx-rainbow .rainbow { opacity: .45; }
.speaker { position: absolute; bottom: 6%; height: var(--spk, 120px); width: calc(var(--spk, 120px) * .62); display: none; z-index: 1; transform-origin: 50% 100%; transition: transform .4s ease; }
.speaker.l { left: 2.5%; } .speaker.r { right: 2.5%; }
.has-speakers .speaker { display: block; }
.speaker svg { width: 100%; height: 100%; display: block; }
.cone { transform-box: fill-box; transform-origin: center; transform: scale(calc(1 + var(--kick) * .14)); }
.fx-beats .speaker { transform: scale(1.22); }
.fx-beats #slots { transform: translateY(calc(var(--kick) * 3px)); }
.beams { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .8s; overflow: hidden; }
.beams i { position: absolute; top: -10%; width: 26%; height: 120%; transform-origin: 50% 0; mix-blend-mode: screen;
  background: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 85%); clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); }
.beams i:nth-child(1) { left: 6%; background: linear-gradient(180deg, rgba(255, 120, 200, .6), transparent 85%); animation: sweep 3.1s ease-in-out infinite alternate; }
.beams i:nth-child(2) { left: 37%; background: linear-gradient(180deg, rgba(120, 200, 255, .6), transparent 85%); animation: sweep 2.6s ease-in-out -1s infinite alternate-reverse; }
.beams i:nth-child(3) { left: 68%; background: linear-gradient(180deg, rgba(255, 230, 120, .6), transparent 85%); animation: sweep 3.4s ease-in-out -2s infinite alternate; }
@keyframes sweep { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
.fx-party .beams { opacity: 1; }
.disco { position: absolute; left: 50%; top: -120px; width: 64px; height: 64px; margin-left: -32px; transition: top 1s cubic-bezier(.3, 1.4, .5, 1); pointer-events: none; }
.disco::before { content: ''; position: absolute; left: 50%; bottom: 100%; width: 2px; height: 120px; background: rgba(42, 27, 77, .45); }
.disco::after { content: ''; position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 30px rgba(255, 255, 255, .8), inset -6px -8px 0 rgba(0, 0, 0, .12);
  background: repeating-conic-gradient(#E9E3FF 0 10deg, #9F92D8 10deg 20deg, #FFFFFF 20deg 30deg, #C7BCF2 30deg 40deg); animation: spin 3s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.fx-party .disco { top: 4px; }

#slots { position: absolute; inset: 0; z-index: 2; }
.slot { position: absolute; touch-action: none; }
.slot .who { position: absolute; inset: 0; }
.slot .who svg { width: 100%; height: 100%; display: block; overflow: visible; }
.who.char { display: none; }
.slot.on .who.char { display: block; cursor: grab; }
.slot.on .who.gray { display: none; }
.who.gray { transition: filter .2s, transform .2s; transform-origin: 50% 98%; }
.slot.target .who.gray { transform: scale(1.06); filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 22px rgba(255, 255, 255, .9)); }
.slot.target .pad { --hit: 1; }
.slot.poked .who.gray { animation: poke .5s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes poke { 30% { transform: translateY(-6%) scale(1.04, .96); } }
.is-night .who.gray { filter: brightness(.82); }
.pad { position: absolute; left: -12%; right: -12%; bottom: 0; height: 24%; transform: translateY(46%); pointer-events: none; --hit: .15; }
.pad::before { content: ''; position: absolute; inset: 22% 18%; border-radius: 50%; background: rgba(42, 27, 77, .18); filter: blur(3px); }
.pad::after { content: ''; position: absolute; inset: 0; border-radius: 50%; opacity: var(--hit);
  background: radial-gradient(closest-side, var(--c, #fff), rgba(255, 255, 255, 0)); }
.slot:not(.on):not(.target) .pad::after { opacity: .35; background: radial-gradient(closest-side, rgba(255, 255, 255, .9), rgba(255, 255, 255, 0)); }
.slot.arrive .who.char { animation: arrive .6s cubic-bezier(.3, 1.6, .5, 1) var(--d, 0ms) both; transform-origin: 50% 98%; }
@keyframes arrive { 0% { transform: translateY(8%) scale(.35, .5); opacity: 0; } 60% { transform: scale(1.08, .94); opacity: 1; } 100% { transform: none; } }
.slot.lifting .who.char { opacity: .3; }
.slot.muted .who.char { opacity: .4; filter: grayscale(.8); }
.has-solo .slot.on:not(.solo) .who.char { opacity: .35; filter: grayscale(.6); }
.slot.solo .pad { --hit: 1 !important; }
.slot.solo::before { content: ''; position: absolute; left: -20%; right: -20%; top: -40%; bottom: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .45)); clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%); }
.badge { position: absolute; right: 4%; top: 18%; width: 28%; aspect-ratio: 1; border-radius: 50%; background: var(--ink); color: #fff; display: none; place-items: center; box-shadow: 0 3px 8px rgba(42, 27, 77, .3); }
.badge svg { width: 62%; height: 62%; }
.slot.muted .badge { display: grid; }
.halo { position: absolute; left: 24%; right: 24%; top: 2%; height: 9%; border-radius: 50%; border: 4px solid #FFD84D; opacity: 0; pointer-events: none;
  box-shadow: 0 0 14px rgba(255, 216, 77, .9), inset 0 0 8px rgba(255, 216, 77, .8); transition: opacity .6s; animation: halo 2.4s ease-in-out infinite; }
.fx-choir .slot.on .halo { opacity: 1; }
@keyframes halo { 50% { transform: translateY(-6px); } }
.say { position: absolute; left: 50%; top: 4%; z-index: 3; transform: translate(-50%, -60%) scale(0); background: var(--paper); color: var(--ink);
  font: 800 clamp(13px, 1.5vw, 17px)/1 var(--f-ui); padding: 7px 12px 5px; border-radius: 999px; white-space: nowrap; pointer-events: none;
  box-shadow: 0 3px 0 rgba(42, 27, 77, .15), 0 8px 18px rgba(42, 27, 77, .15); }
.say::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: var(--paper); }
.say.show { animation: say 1.9s ease both; }
@keyframes say { 0% { transform: translate(-50%, -60%) scale(0); } 12% { transform: translate(-50%, -60%) scale(1.15); } 20%, 82% { transform: translate(-50%, -60%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -80%) scale(.9); opacity: 0; } }
#fx { position: absolute; left: 0; top: 0; z-index: 4; pointer-events: none; }
#stage.is-paused::after { content: 'Pausado'; position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 5;
  font: 400 clamp(28px, 5vw, 54px)/1 var(--f-display); color: var(--paper); padding: 14px 28px; border-radius: 22px; background: rgba(42, 27, 77, .55); pointer-events: none; }
.is-paused .who.char { filter: saturate(.55); }

/* menu do personagem */
#menu { position: absolute; z-index: 6; transform: translate(-50%, -50%); display: flex; gap: 6px; padding: 8px; border-radius: 22px; background: var(--paper);
  box-shadow: 0 4px 0 rgba(42, 27, 77, .15), 0 14px 30px rgba(42, 27, 77, .25); }
#menu.pop { animation: menuPop .3s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes menuPop { from { transform: translate(-50%, -50%) scale(.5); opacity: 0; } }
#menuName { position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -6px); font: 800 14px/1 var(--f-ui); color: var(--ink); background: var(--gold); padding: 6px 10px 4px; border-radius: 999px; white-space: nowrap; }
#menu button { width: 64px; border: 0; border-radius: 16px; background: #F1ECFF; padding: 8px 4px 6px; cursor: pointer; display: grid; justify-items: center; gap: 2px; font: 700 11px/1.1 var(--f-ui); color: var(--ink); }
#menu button svg { width: 24px; height: 24px; }
#menu button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
#menu button.rm { background: #FFE3DA; color: #B42318; }

/* faixas e avisos */
#banner { position: absolute; left: 50%; top: 12px; z-index: 7; display: flex; align-items: center; gap: 12px; padding: 10px 22px 10px 12px; border-radius: 24px;
  background: var(--paper); box-shadow: 0 5px 0 rgba(42, 27, 77, .15), 0 18px 40px rgba(42, 27, 77, .28); transform: translate(-50%, -140%); transition: transform .45s cubic-bezier(.3, 1.4, .5, 1); pointer-events: none; }
#banner.show { transform: translate(-50%, 0); }
.b-icon { width: 54px; height: 54px; border-radius: 16px; background: #F4EFFF; display: grid; place-items: center; }
.b-icon svg { width: 42px; height: 42px; }
.b-kicker { font: 800 12px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--hot); }
.b-title { font: 400 clamp(20px, 2.6vw, 28px)/1.1 var(--f-display); color: var(--ink); margin-top: 3px; white-space: nowrap; }
#toast { position: absolute; left: 50%; top: 18%; z-index: 7; transform: translateX(-50%); max-width: calc(100% - 32px); text-align: center;
  background: var(--ink); color: var(--paper); font: 700 15px/1.25 var(--f-ui); padding: 10px 16px; border-radius: 16px; pointer-events: none; }
#toast.show { animation: toast 2.6s ease both; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

/* ---------- bandeja de personagens ---------- */
#palette { position: relative; z-index: 4; flex: none; display: grid; grid-template-columns: repeat(2, auto); justify-content: center; gap: 10px 26px;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--paper); border-radius: 28px 28px 0 0;
  box-shadow: 0 -10px 30px rgba(42, 27, 77, .12); }
.group { display: grid; gap: 6px; min-width: 0; }
.glabel { display: flex; align-items: center; gap: 6px; font: 800 12px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--cat); padding-left: 4px; }
.glabel .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cat); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cat) 22%, transparent); }
.tiles { display: flex; gap: 7px; }
.tile { position: relative; width: var(--tile); height: var(--tile); flex: none; border: 0; padding: 0; border-radius: 30%; cursor: grab; touch-action: none;
  background: linear-gradient(180deg, #FFFFFF, #F3EEFF); box-shadow: 0 3px 0 rgba(42, 27, 77, .14), inset 0 0 0 2px rgba(42, 27, 77, .06);
  transition: transform .18s cubic-bezier(.3, 1.6, .5, 1), opacity .2s, filter .2s; }
.tile::before { content: ''; position: absolute; inset: 14%; border-radius: 50%; background: var(--c); opacity: .2; }
.tile svg { position: absolute; inset: 3% 3% 9%; width: 94%; height: 88%; }
.tname { position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%); font: 800 10px/1 var(--f-ui); color: var(--ink); background: rgba(255, 255, 255, .92); padding: 2px 5px 1px; border-radius: 99px; white-space: nowrap; pointer-events: none; }
.tile:hover { transform: translateY(-3px); }
.tile:active { transform: scale(.92); }
.tile.lifted { opacity: .35; transform: scale(.9); }
.tile.used { filter: grayscale(1); opacity: .42; }
.tile.nope { animation: nope .4s ease; }
@keyframes nope { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
.tile.special { background: radial-gradient(circle at 30% 25%, #4B3FB0, #1E1850 75%); box-shadow: 0 3px 0 rgba(42, 27, 77, .3), 0 0 0 2px #FFE27A, 0 0 14px rgba(255, 226, 122, .55); margin-left: 6px; }
.tile.special::before { background: #FFE27A; opacity: .16; }
.tile.special .tname { background: #FFE27A; }

#ghost { position: fixed; left: 0; top: 0; z-index: 60; width: 104px; height: 104px; pointer-events: none; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, .95) 0 55%, rgba(255, 255, 255, 0) 70%); filter: drop-shadow(0 12px 14px rgba(42, 27, 77, .3)); }
#ghost svg { width: 100%; height: 100%; }
body.dragging, body.dragging * { cursor: grabbing !important; }

/* dica da mãozinha */
#hint { position: fixed; left: 0; top: 0; z-index: 55; pointer-events: none; animation: hintMove 2.6s cubic-bezier(.45, 0, .3, 1) infinite; }
#hint .hi { width: 54px; height: 54px; transform: translate(-50%, -64%); border-radius: 50%; background: radial-gradient(circle, #fff 0 55%, transparent 70%); }
#hint .hi svg { width: 100%; height: 100%; }
#hint .hand { position: absolute; left: -4px; top: 2px; width: 46px; height: 46px; filter: drop-shadow(0 4px 6px rgba(42, 27, 77, .35)); }
@keyframes hintMove {
  0% { transform: translate(var(--x0), var(--y0)) scale(.9); opacity: 0; }
  12% { transform: translate(var(--x0), var(--y0)) scale(1); opacity: 1; }
  62% { transform: translate(var(--x1), var(--y1)) scale(1); opacity: 1; }
  80% { transform: translate(var(--x1), var(--y1)) scale(.92); opacity: 1; }
  100% { transform: translate(var(--x1), var(--y1)) scale(.92); opacity: 0; } }

/* ---------- abertura ---------- */
#intro { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px 16px; overflow: auto;
  background: radial-gradient(70% 55% at 50% 30%, rgba(255, 255, 255, .7), rgba(255, 255, 255, 0)), linear-gradient(180deg, var(--sky-top), var(--sky-mid) 55%, var(--sky-low));
  transition: opacity .6s ease, transform .6s ease; }
#intro.leaving { opacity: 0; transform: scale(1.06); pointer-events: none; }
.intro-card { display: grid; justify-items: center; gap: 14px; text-align: center; width: 100%; max-width: 640px; min-width: 0; }
#intro .logo { font-size: clamp(46px, 11vw, 112px); }
#intro .logo span { animation: letter 1.8s ease-in-out infinite; animation-delay: calc(var(--i, 0) * 90ms); }

.is-horror .slot:not(.on):not(.target) .pad::after { background: radial-gradient(closest-side, rgba(255, 80, 30, .55), rgba(255, 80, 30, 0)); }
.is-horror .slot.target .who.gray { filter: drop-shadow(0 0 10px #FF3B2F) drop-shadow(0 0 22px rgba(255, 40, 20, .8)); }

  background: radial-gradient(ellipse at 50% 55%, rgba(0, 0, 0, 0) 45%, rgba(20, 0, 0, .7) 100%); }
