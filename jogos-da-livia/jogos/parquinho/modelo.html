<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelo do Sprunki — Parquinho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lilita+One&display=swap">
<style>
  :root { color-scheme: dark; --bg: #1F2230; --txt: #EEF0F7; --mut: #A7ADC2; --gold: #FFC93C; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--txt); font-family: 'Baloo 2', system-ui, sans-serif; display: grid; place-items: center; }
  .wrap { width: min(1200px, 100% - 32px); padding-block: 20px; display: grid; gap: 12px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font: 400 30px/1.1 'Lilita One', sans-serif; }
  label { font-weight: 700; color: var(--mut); }
  select { font: 700 16px 'Baloo 2', sans-serif; padding: 6px 10px; border-radius: 10px; background: #2A2E3D; color: var(--txt); border: 2px solid #444A60; }
  canvas { width: 100%; height: auto; display: block; border-radius: 18px; box-shadow: 0 0 0 3px #0E1016, 0 18px 40px rgba(0, 0, 0, .4); }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Modelo do Sprunki no Parquinho</h1>
    <label>Personagem: <select id="sel"></select></label>
  </div>
  <canvas id="cv" width="2400" height="1440"></canvas>
</div>
<script src="../comum/personagens.js"></script>
<script src="sprites.js"></script>
<script>
(function () {
  'use strict';
  const S = window.Sprites, cv = document.getElementById('cv'), cx = cv.getContext('2d'), W = 1200, H = 720, T = 56;
  let id = 'bumbo';
  const sel = document.getElementById('sel');
  window.SPR.CHARS.forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.name; sel.appendChild(o); });
  sel.value = id; sel.addEventListener('change', () => { id = sel.value; });
  S.preload();

  const NORMAL = ['parado', 'andando', 'pistola', 'metralhadora', 'arco', 'taco', 'caído'];
  const TERROR = ['parado', 'andando', 'atacando', 'caído'];
  function poseNormal(k, t) {
    const c = { id, horror: false, face: 1, armF: -0.25, armB: 0.25, legA: 0, rot: 0, bob: 0 }, w = Math.sin(t * Math.PI * 2 * 1.4);
    if (k === 'parado') { c.bob = Math.sin(t * 2) * 1.2; c.armF -= Math.sin(t * 2) * 0.05; c.armB += Math.sin(t * 2) * 0.05; }
    else if (k === 'andando') { c.legA = w * 0.55; c.armF = -0.25 - w * 0.5; c.armB = 0.25 + w * 0.5; c.bob = -Math.abs(w) * 3; }
    else if (k === 'pistola') { c.weapon = 'pistola'; c.armF = -Math.PI / 2; const p = (t % 0.8) / 0.8; c.recoil = p < 0.15 ? 1 - p / 0.15 : 0; c.flash = p < 0.06; }
    else if (k === 'metralhadora') { c.weapon = 'metralhadora'; c.armF = -Math.PI / 2 + Math.sin(t * 40) * 0.02; const on = t % 2 < 1.2, p = (t % 0.12) / 0.12; c.recoil = on ? 1 - p : 0; c.flash = on && p < 0.4; }
    else if (k === 'arco') { c.weapon = 'arco'; c.armF = -Math.PI / 2 - 0.25; c.armB = -1.25; }
    else if (k === 'taco') {
      c.weapon = 'taco'; const p = (t % 1.4) / 1.4;
      c.armF = p < 0.55 ? -0.6 - (p / 0.55) * 3.0 : p < 0.7 ? -3.6 + ((p - 0.55) / 0.15) * 3.0 : -0.6;
    }
    else if (k === 'caído') { c.rot = Math.PI / 2; c.stars = true; }
    return c;
  }
  function poseHorror(k, t) {
    const c = { id, horror: true, face: -1, armF: -1.35 + Math.sin(t * 5) * 0.1, armB: -1.2 + Math.sin(t * 5 + 1) * 0.1, legA: 0, rot: -0.12, bob: 0 };
    if (k === 'parado') c.bob = Math.sin(t * 3) * 1.5;
    else if (k === 'andando') { const w = Math.sin(t * Math.PI * 2); c.legA = w * 0.45; c.bob = -Math.abs(w) * 2; }
    else if (k === 'atacando') { const p = t % 1; c.armF = p < 0.3 ? -1.35 - (p / 0.3) * 1.7 : p < 0.42 ? -3.05 + ((p - 0.3) / 0.12) * 2.6 : -0.45 - ((p - 0.42) / 0.58) * 0.9; }
    else if (k === 'caído') { c.rot = -Math.PI / 2; c.stars = true; }
    return c;
  }

  function sky() {
    const g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#8FD3FF'); g.addColorStop(0.7, '#CFEFFF'); g.addColorStop(1, '#EAF8FF');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  }
  function ground(y) {
    cx.imageSmoothingEnabled = false;
    for (let x = 0; x < W; x += T) { cx.drawImage(S.blockTex('grama'), x, y, T, T); cx.drawImage(S.blockTex('terra'), x, y + T, T, T); }
    cx.imageSmoothingEnabled = true;
  }
  function label(text, x, y) {
    cx.font = "800 17px 'Baloo 2', sans-serif"; cx.textAlign = 'center'; cx.lineJoin = 'round';
    cx.lineWidth = 5; cx.strokeStyle = 'rgba(31, 34, 48, .85)'; cx.strokeText(text, x, y); cx.fillStyle = '#fff'; cx.fillText(text, x, y);
  }
  function star(x, y, r, col) {
    cx.fillStyle = col; cx.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; cx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    cx.closePath(); cx.fill();
  }
  function extras(c, px, py, t) {
    const s = T * S.SIZE / 352;
    if (c.flash) { // clarão na ponta da arma
      const A = S.ARMAS[c.weapon], d = (60 + (A.muzzle[0] - A.hold[0]) * S.WS) * s;
      star(px + c.face * (34 * s + d), py - 106 * s + (A.muzzle[1] - A.hold[1]) * S.WS * s, 14, '#FFE14D');
    }
    if (c.stars) {
      const hx = px + Math.sin(c.rot) * 190 * s, hy = py - 44 * s - Math.cos(c.rot) * 190 * s - 22;
      for (let i = 0; i < 3; i++) { const a = t * 4 + i * 2.1; star(hx + Math.cos(a) * 20, hy + Math.sin(a) * 6, 7, '#FFD84D'); }
    }
  }
  function frame(ts) {
    requestAnimationFrame(frame);
    const t = ts / 1000;
    cx.setTransform(2, 0, 0, 2, 0, 0); sky();
    const g1 = 300, g2 = 620;
    ground(g1); ground(g2);
    NORMAL.forEach((k, i) => {
      const x = 92 + i * 165, c = poseNormal(k, t);
      S.drawPuppet(cx, c, x, g1 + c.bob, T); extras(c, x, g1 + c.bob, t);
      label(k, x, 60);
    });
    label('NORMAL', 50, 26);
    TERROR.forEach((k, i) => {
      const x = 115 + i * 165, c = poseHorror(k, t);
      S.drawPuppet(cx, c, x, g2 + c.bob, T); extras(c, x, g2 + c.bob, t);
      label(k, x, 382);
    });
    label('TERROR', 50, 348);
    // os blocos
    cx.imageSmoothingEnabled = false;
    Object.keys(S.BLOCOS).forEach((b, i) => { cx.drawImage(S.blockTex(b), 735 + i * 74, g2 - T, T, T); });
    cx.imageSmoothingEnabled = true;
    Object.keys(S.BLOCOS).forEach((b, i) => label(S.BLOCOS[b].nome, 735 + T / 2 + i * 74, g2 - T - 12));
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
